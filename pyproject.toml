# Project metadata and tool settings. uv reads this file to build the virtual
# environment; the exact version of every package is locked in uv.lock.

[project]
name = "moodai"
version = "0.1.0"
description = "Local, privacy-first assistant that suggests mood disorder hypotheses for mental health professionals (academic prototype, not a diagnostic tool)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luiz Passarinho" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (style)
    "W",   # pycodestyle warnings (whitespace)
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify (simpler code)
    "ANN", # flake8-annotations (type hints)
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true # __init__ may omit "-> None"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"] # tests do not need type hints

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-socket: block every network connection except to this machine (RNF01).
addopts = ["--allow-hosts=127.0.0.1,::1"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.5",
]

# PyTorch comes from the official PyTorch indexes, not from PyPI: on Windows the
# CUDA 13.2 build (it uses the RTX 3050), on Linux the CPU-only build (the CI has
# no GPU, so it downloads 200 MB instead of 2 GB).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true # only for the packages listed in [tool.uv.sources]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
