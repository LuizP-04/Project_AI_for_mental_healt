# Default configuration. Paths are relative to the repository root.
# Each new module (OCR, classifiers, debate...) adds its own section here.

seed: 42 # fixed random seed, for reproducible experiments (RNF04)

languages: [pt, en] # Portuguese and English

# Local folders for data and artifacts. All of them are ignored by git.
paths:
  raw_data: data/raw # original datasets
  processed_data: data/processed # cleaned and split datasets
  models: models # downloaded or fine-tuned model weights
  outputs: outputs # experiment results

# Local LLMs for the debate and the judge (Etapa 3), served by Ollama on this machine.
# The text sent to them must never leave the computer, so only loopback addresses are accepted.
llm:
  ollama_version: "0.40.16" # version the project was measured with (RNF04); check_env warns if it differs
  host: http://127.0.0.1:11434 # Ollama's default address, on this machine only
  timeout_s: 300 # give up on a request after this many seconds
  num_ctx: 8192 # context window in tokens (Ollama's default for a 6 GB GPU is 4096)
  keep_alive: 5m # how long a model stays in GPU memory after its last request
  models: # candidates measured in step 3.1; the debate roles are chosen in step 3.2
    - qwen3.5:4b-q4_K_M
    - gemma4:e2b-it-qat
